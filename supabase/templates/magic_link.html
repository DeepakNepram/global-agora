<!doctype html>
<html lang="en">
  <body
    style="
      margin: 0;
      padding: 24px;
      background: #ffffff;
      color: #111827;
      font-family:
        system-ui,
        -apple-system,
        Segoe UI,
        Roboto,
        sans-serif;
      line-height: 1.5;
    "
  >
    <h1 style="font-size: 20px; margin: 0 0 16px">Sign in to Global Agora</h1>
    <p style="margin: 0 0 8px">Type this code where you asked to sign in:</p>
    <p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 0 0 20px">
      {{ .Token }}
    </p>
    <p style="margin: 0 0 8px">Or open this link in the same browser:</p>
    <p style="margin: 0 0 20px">
      <a href="{{ .ConfirmationURL }}" style="color: #1d4ed8">Sign in to Global Agora</a>
    </p>
    <p style="margin: 0; color: #4b5563; font-size: 14px">
      The code and the link work once and expire in an hour. If you did not ask to sign in, you can
      ignore this email: nothing happens without it.
    </p>
  </body>
</html>

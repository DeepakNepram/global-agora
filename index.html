<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05070d" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta
      name="description"
      content="Browse the world's news on a living 3D Earth, scrub back through the last 24 hours, and debate hot stories."
    />
    <title>Global Agora</title>
    <!--
      The first Earth the globe draws (previewTextureSet in src/core/textures.ts):
      fetched alongside the JavaScript, not after it runs. crossorigin must match
      three's TextureLoader ('anonymous') or the browser downloads each map twice.
    -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/textures/day-2048.webp"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/textures/night-2048.webp"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 1.5rem; font-family: system-ui, sans-serif; color: #e8edf7">
        Global Agora needs JavaScript to show the news.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
